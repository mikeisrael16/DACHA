<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d6b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%D0%AF%D1%80%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BB%D1%8C%3A%20%D0%9C%D0%BE%D1%8F%20%D0%B4%D0%B0%D1%87%D0%B0%22%2C%22display%22%3A%22fullscreen%22%2C%22orientation%22%3A%22landscape%22%2C%22background_color%22%3A%22%231d2a14%22%7D">
<title>Ярославль: Моя дача</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;height:100dvh;position:fixed;inset:0;overflow:hidden;background:#1d2a14;font-family:'Rubik','Trebuchet MS',Arial,sans-serif;touch-action:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:893px;transform-origin:0 0;overflow:hidden;background:#3d6b2a}
#view{position:absolute;inset:0;overflow:hidden;touch-action:none}
.screen{position:absolute;inset:0}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}

/* ---------- TITLE ---------- */
#title{z-index:50;background:#1d2a14;overflow:hidden}
#title .tbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(18px) brightness(.8)}
#title .tbox{position:absolute;left:0;top:0;width:1600px;height:893px;transform-origin:0 0}
#title .tbox>img{width:100%;height:100%;display:block}
#title .note{position:absolute;left:356px;top:668px;width:394px;text-align:center;font-weight:800;font-size:21px;color:#ffe9b8;text-shadow:0 2px 0 #5b391c,0 0 6px rgba(0,0,0,.4);line-height:1.25;pointer-events:none}
.hot{position:absolute;left:374px;width:358px;height:86px;border-radius:30px;cursor:pointer;pointer-events:auto}
.hot:active{background:rgba(255,255,255,.18)}
#hotCont{top:404px}#hotNew{top:531px}
#title .ver{position:absolute;right:14px;bottom:10px;color:#fff;font-size:15px;opacity:.75;text-shadow:0 1px 2px #000}

/* ---------- WORLD ---------- */
#game{display:none}
#world{position:absolute;left:0;top:0;width:1600px;height:893px;transform-origin:0 0}
#world.anim,#guideL.anim{transition:transform 1.2s cubic-bezier(.45,.05,.3,1)}
#guideL{position:absolute;left:0;top:0;width:1600px;height:893px;transform-origin:0 0;pointer-events:none;z-index:49}
#world>.bg{position:absolute;inset:0;width:100%;height:100%}
svg.layer{position:absolute;left:0;top:0;width:1600px;height:893px;pointer-events:none;overflow:visible}
#hitSvg polygon{pointer-events:all;cursor:pointer;fill:transparent}
#hitSvg polygon.off{pointer-events:none}
.soilg{opacity:0;transition:opacity .5s}
.soilg.on{opacity:1}
.soilg .sf{transition:fill .8s}
.frame{transform-box:fill-box;transform-origin:50% 100%}
.frame.pop{animation:framePop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes framePop{from{transform:scale(.3);opacity:0}}
.plants,.bubs{position:absolute;inset:0;pointer-events:none}
.plant{position:absolute;transform-origin:50% 100%;pointer-events:none}
.plant img{width:100%;display:block}
.plant.ripe{animation:sway 2.2s ease-in-out infinite}
.plant.pop{animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes sway{0%,100%{transform:translate(-50%,-100%) rotate(-2deg)}50%{transform:translate(-50%,-100%) rotate(2deg) scale(1.03)}}
@keyframes popIn{0%{transform:translate(-50%,-100%) scale(.2)}100%{transform:translate(-50%,-100%) scale(1)}}
.hitbox{position:absolute;cursor:pointer}
#barrelHit{left:440px;top:490px;width:115px;height:165px}
#houseHit{left:240px;top:60px;width:680px;height:420px}
#gauge{position:absolute;left:432px;top:452px;width:132px;height:40px;background:rgba(30,50,80,.85);border:3px solid #fff;border-radius:20px;display:flex;align-items:center;gap:6px;padding:0 8px;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.35)}
#gauge .drop{width:22px;height:22px}
#gauge .segs{display:flex;gap:4px;flex:1}
#gauge .seg{flex:1;height:16px;border-radius:6px;background:#2a3446;border:1px solid #6d86a8;transition:background .4s}
#gauge .seg.full{background:linear-gradient(#7fd3ff,#2c8de0)}
#gaugeTimer{position:absolute;left:397px;top:398px;width:200px;text-align:center;font-size:17px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none}
#canBadge{position:absolute;left:560px;top:540px;width:62px;height:62px;pointer-events:none;opacity:0;transform:scale(.4);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
#canBadge.on{opacity:1;transform:scale(1)}
#canBadge img{width:100%}

/* order board */
#board{position:absolute;left:1418px;top:312px;width:160px;height:190px;cursor:pointer}
#board .post{position:absolute;bottom:0;width:14px;height:110px;background:linear-gradient(90deg,#6b4423,#8a5a30,#5b391c);border-radius:3px}
#board .plank{position:absolute;left:0;top:0;width:160px;height:118px;background:repeating-linear-gradient(0deg,#a8743f 0 28px,#8d5f31 28px 30px);border:4px solid #5b391c;border-radius:10px;box-shadow:0 6px 10px rgba(0,0,0,.35)}
#board .head{position:absolute;left:12px;top:-20px;width:136px;height:32px;background:#c0392b;color:#fff;font-weight:900;font-size:17px;text-align:center;line-height:30px;border-radius:8px;border:3px solid #7b1f16;letter-spacing:1px}
#board .note{position:absolute;width:40px;height:46px;background:#fff8e6;border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.3);top:26px}
#board .note:before{content:'';position:absolute;left:16px;top:-4px;width:8px;height:8px;border-radius:50%;background:#d33}
#board .note i{position:absolute;left:6px;right:6px;height:3px;background:#b9ae95;top:16px;box-shadow:0 8px 0 #b9ae95,0 16px 0 #b9ae95}
#board.closed{filter:grayscale(.85) brightness(.85)}
#board .lock{position:absolute;left:56px;top:40px;font-size:38px;display:none}
#board.closed .lock{display:block}
#board.closed .note{display:none}
#boardBadge{position:absolute;right:-8px;top:-30px;min-width:34px;height:34px;border-radius:17px;background:#e74c3c;color:#fff;font-weight:900;font-size:19px;text-align:center;line-height:30px;border:3px solid #fff;display:none}

/* tray */
#tray{position:absolute;display:none;padding:10px 14px 16px;background:linear-gradient(#b98450,#8d5f31);border:4px solid #5b391c;border-radius:26px;box-shadow:0 8px 18px rgba(0,0,0,.45);gap:10px;z-index:5;transform:translate(-50%,-100%)}
#tray:after{content:'';position:absolute;left:50%;bottom:-18px;margin-left:-14px;border:14px solid transparent;border-top-color:#5b391c;border-bottom:0}
#tray.on{display:flex;animation:trayIn .25s cubic-bezier(.3,1.5,.5,1)}
@keyframes trayIn{from{transform:translate(-50%,-100%) scale(.5);opacity:0}}
.titem{position:relative;width:92px;height:92px;touch-action:none;cursor:grab}
.titem img{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.titem .cnt{position:absolute;right:-4px;bottom:-4px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:#2e7d32;color:#fff;font-weight:900;font-size:17px;line-height:26px;text-align:center;border:2px solid #fff}
.titem .lbl{position:absolute;left:-10px;right:-10px;bottom:-22px;text-align:center;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.titem.dim img{filter:grayscale(1) opacity(.55)}
.titem.drag img{opacity:.25}
#ghost{position:absolute;width:104px;height:104px;pointer-events:none;z-index:40;display:none;transform:translate(-50%,-50%) rotate(-10deg);filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}
#ghost img{width:100%}

/* bed overhead icons */
.bubble{position:absolute;transform:translate(-50%,-100%);pointer-events:none;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{margin-top:-10px}}
.bubble .b{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid #4aa3df;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.3)}
.bubble.ready .b{border-color:#f1c40f;width:76px;height:76px}
.bubble img{width:80%}
.pbar{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:10px;background:rgba(255,248,225,.97);border:4px solid #7a4e26;border-radius:24px;padding:6px 16px 6px 6px;box-shadow:0 6px 14px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap}
.pbar img{width:52px;height:52px;object-fit:contain}
.pbar .lb{font-size:16px;font-weight:800;color:#6d4b27;margin-bottom:4px}
.pbar .track{position:relative;width:220px;height:22px;background:#d8c49a;border-radius:11px;border:2px solid #7a4e26;overflow:hidden}
.pbar .fill{height:100%;background:linear-gradient(#9be36d,#4c9a2a);transition:width .2s linear}
.pbar.act .fill{background:linear-gradient(#ffd27a,#e67e22)}
.pbar .mark{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#2c8de0}
.pbar .tm{font-weight:900;font-size:24px;color:#4a2e14;min-width:62px;text-align:right}
.status{position:absolute;transform:translate(-50%,0);background:rgba(40,60,20,.88);color:#fff;font-weight:800;font-size:18px;padding:6px 14px;border-radius:16px;border:2px solid #cfe8a8;white-space:nowrap;pointer-events:none}

/* guide */
#ghImg{position:absolute;left:6px;top:330px;width:244px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35));pointer-events:none}
#ghImg.pop{animation:framePop .7s cubic-bezier(.3,1.6,.5,1)}
#cctv{position:absolute;left:928px;top:228px;width:70px;height:50px;pointer-events:none}
#cctv .led{animation:led 1.2s steps(2) infinite}@keyframes led{50%{opacity:.15}}
#kitchenBub{position:absolute;left:318px;top:440px;transform:translate(-50%,-100%);cursor:pointer;display:none}
#kitchenBub .kb{display:flex;align-items:center;gap:6px;background:rgba(255,248,225,.97);border:4px solid #7a4e26;border-radius:20px;padding:4px 10px 4px 4px;box-shadow:0 5px 12px rgba(0,0,0,.35);font-weight:900;font-size:18px;color:#4a2e14;white-space:nowrap}
#kitchenBub img{width:54px;height:54px;object-fit:contain}
#kitchenBub.ready .kb{border-color:#f1c40f;animation:bob 1s ease-in-out infinite}
#thieves{position:absolute;inset:0;pointer-events:none}
.thief{position:absolute;width:110px;height:140px;margin:-140px 0 0 -55px;pointer-events:auto;cursor:pointer;z-index:7}
.thief svg{width:100%;height:100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.thief:not(.flee) svg{animation:sneak .5s ease-in-out infinite alternate}
@keyframes sneak{to{transform:translateY(-4px) rotate(3deg)}}
.thief:after{content:'';position:absolute;inset:-18px}
.kslots{display:flex;gap:14px;margin-bottom:16px;justify-content:center}
.kslot{width:330px;height:96px;border:4px dashed #c9a46d;border-radius:20px;display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(255,255,255,.6);font-weight:800;color:#7a5a3a}
.kslot img{width:80px;height:80px;object-fit:contain}
.kslot.busy{border-style:solid;background:#fff}
.kslot .track{position:relative;height:16px;background:#d8c49a;border-radius:8px;overflow:hidden;border:2px solid #7a4e26;margin-top:6px}
.kslot .fill{height:100%;background:linear-gradient(#ffd27a,#e67e22)}
.need{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:52px}
.need span{display:flex;align-items:center;font-size:13px;font-weight:900;color:#2e7d32}
.need span.miss{color:#c0392b}
.need img{width:30px!important;height:30px!important}
#scarecrow{position:absolute;left:1205px;top:330px;width:130px;height:180px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
#scarecrow img{max-width:100%;max-height:100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
#birds{position:absolute;inset:0;pointer-events:none}
.bird{position:absolute;width:104px;height:78px;margin:-78px 0 0 -52px;pointer-events:auto;cursor:pointer;z-index:6}
.bird svg{width:100%;height:100%;transform-origin:30% 95%;animation:peck .9s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.bird .wing{transform-origin:28px 24px;animation:flap .25s ease-in-out infinite alternate}
.bird:not(.flee) .wing{animation-play-state:paused}
@keyframes peck{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(22deg)}}
@keyframes flap{to{transform:rotate(-35deg)}}
.bird:after{content:'';position:absolute;inset:-22px}
.bug{position:absolute;width:40px;height:36px;pointer-events:none;animation:crawl 1.6s ease-in-out infinite alternate;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.bug svg{width:100%;height:100%}
@keyframes crawl{0%{transform:translate(0,0) rotate(-12deg)}50%{transform:translate(6px,-4px) rotate(8deg)}100%{transform:translate(-4px,3px) rotate(-4deg)}}
.pbar.bugbar{border-color:#c0392b}
.bugico{width:52px;height:46px}.bugico svg{width:100%;height:100%}
#arrow{position:absolute;width:70px;height:84px;margin-left:-35px;margin-top:-84px;pointer-events:none;display:none;z-index:30;animation:arrowB .8s ease-in-out infinite}
@keyframes arrowB{50%{transform:translateY(-16px)}}
#ring{position:absolute;pointer-events:none;display:none;border-radius:50%;border:6px solid #ffe14d;box-shadow:0 0 22px #ffe14d,inset 0 0 18px #ffe14d;z-index:29;animation:ring 1.1s ease-in-out infinite;transform:translate(-50%,-50%)}
@keyframes ring{50%{opacity:.4;transform:translate(-50%,-50%) scale(1.08)}}
#hand{position:absolute;width:90px;height:90px;pointer-events:none;display:none;z-index:31}
#hand img{width:100%;opacity:.85}
#hand .finger{position:absolute;left:46px;top:46px;font-size:54px}

/* night */
#night{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(#08103a,#141d55 60%,#221c48);transition:opacity 3s}
#stars,.win,#dawn{transition:opacity 3s}
#stars{position:absolute;inset:0;pointer-events:none;opacity:0}
#stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.win{position:absolute;pointer-events:none;opacity:0;border-radius:3px;background:linear-gradient(rgba(255,226,150,.8),rgba(255,180,70,.7));mix-blend-mode:screen;box-shadow:0 0 16px 6px rgba(255,190,80,.45),0 0 50px 20px rgba(255,170,60,.2)}
#dawn{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:soft-light}
#warm{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 3s}

/* particles & floats */
.pt{position:absolute;pointer-events:none;border-radius:50%;z-index:20}
.fly{position:absolute;pointer-events:none;z-index:60;width:58px;height:58px;margin:-29px 0 0 -29px}
.fly img{width:100%}
.float{position:absolute;pointer-events:none;z-index:61;font-weight:900;font-size:30px;color:#fff;-webkit-text-stroke:2px #3a2410;paint-order:stroke fill;white-space:nowrap;transform:translate(-50%,-50%);animation:floatUp 1.6s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20}
#hud .h{position:absolute;pointer-events:auto;transition:opacity .4s,transform .4s cubic-bezier(.3,1.6,.5,1)}
#hud .h.hide{opacity:0;transform:scale(.3);pointer-events:none}
.pill{height:58px;border-radius:29px;background:linear-gradient(#fff7e2,#f1dfb5);border:4px solid #7a4e26;box-shadow:0 4px 0 #5b391c,0 6px 12px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;padding:0 18px 0 8px;font-weight:900;font-size:28px;color:#4a2e14}
.pill svg,.pill img{width:44px;height:44px;flex:none}
#hDay{left:18px;top:16px}
#hCoins{left:20px;top:16px;min-width:170px}
#hXp{left:220px;top:16px;width:250px}
#hXp .lv{position:relative;width:46px;height:46px;flex:none}
#hXp .lv span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;-webkit-text-stroke:1px #7a4e26;paint-order:stroke fill}
#hXp .bar{flex:1;height:20px;background:#d8c49a;border-radius:10px;border:2px solid #7a4e26;overflow:hidden}
#hXp .bar i{display:block;height:100%;width:0;background:linear-gradient(#ffe66d,#f0a500);transition:width .6s}
.rbtn{width:76px;height:76px;border-radius:50%;background:linear-gradient(#fff7e2,#f1dfb5);border:4px solid #7a4e26;box-shadow:0 4px 0 #5b391c,0 6px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rbtn:active,.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5b391c}
.rbtn img,.rbtn svg{width:62px;height:62px}
#hStore{right:292px;top:8px}
#hZin{right:16px;top:100px;width:66px;height:66px}
#hZout{right:16px;top:176px;width:66px;height:66px}
#hZin span,#hZout span{font-size:44px;font-weight:900;color:#7a4e26;line-height:1;margin-top:-4px}
#clock{right:110px;top:104px;height:46px;font-size:20px;padding:0 14px 0 8px}
#clock svg{width:34px;height:34px}
#hMusic{right:200px;top:8px}
#hSound{right:108px;top:8px}
#hMenu{right:16px;top:8px}
#hStore .cnt{position:absolute;right:-6px;bottom:-6px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:#2e7d32;color:#fff;font-weight:900;font-size:17px;line-height:26px;text-align:center;border:2px solid #fff}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:26px;border:4px solid #7a4e26;box-shadow:0 5px 0 #5b391c,0 8px 14px rgba(0,0,0,.4);font-weight:900;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.35);paint-order:stroke fill;text-align:center;line-height:1.05}
#hShop{left:20px;bottom:20px;width:130px;height:130px;background:linear-gradient(#ffb347,#e67e22);font-size:22px}
#hShop svg{width:78px;height:70px}
#hQuest{left:20px;bottom:166px;width:96px;height:96px;background:linear-gradient(#8fd16a,#4c9a2a);font-size:15px;border-radius:22px}
#hQuest svg{width:52px;height:52px}
#hQuest .dot{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#e74c3c;border:3px solid #fff;display:none}
#hRest{right:20px;bottom:20px;width:200px;height:120px;background:linear-gradient(#7aa7ff,#3b5fc4);font-size:21px;padding:4px}
#hRest svg{width:64px;height:52px}
#hint{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:rgba(255,248,225,.96);border:4px solid #7a4e26;border-radius:22px;padding:10px 24px;font-size:24px;font-weight:800;color:#4a2e14;box-shadow:0 6px 14px rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;display:none;z-index:25}
#hint.on{display:block;animation:hintIn .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes hintIn{from{transform:translateX(-50%) scale(.6);opacity:0}}
#toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);background:rgba(40,30,15,.92);color:#fff;font-size:24px;font-weight:700;padding:14px 26px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:70;max-width:1000px;text-align:center}
#toast.on{opacity:1}

/* ---------- DIALOG ---------- */
#dlg{position:absolute;inset:0;z-index:60;display:none;cursor:pointer}
#dlg.on{display:block}
#dlg .shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.35))}
#dlg .por{position:absolute;left:10px;bottom:0;width:330px;height:330px;display:flex;align-items:flex-end;justify-content:center;animation:porIn .45s cubic-bezier(.3,1.4,.5,1)}
#dlg .por img{max-width:330px;max-height:330px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
@keyframes porIn{from{transform:translateY(120px);opacity:0}}
#dlg .box{position:absolute;left:330px;right:40px;bottom:30px;min-height:170px;background:linear-gradient(#fffaf0,#f5e6c4);border:5px solid #7a4e26;border-radius:30px;padding:22px 34px 46px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
#dlg .box:before{content:'';position:absolute;left:-30px;bottom:60px;border:16px solid transparent;border-right:24px solid #7a4e26;border-left:0}

function mkGeo(L,T,R,B){const P=(u,v)=>[L[0]+u*(T[0]-L[0])+v*(B[0]-L[0])+u*v*(R[0]-T[0]-B[0]+L[0]),L[1]+u*(T[1]-L[1])+v*(B[1]-L[1])+u*v*(R[1]-T[1]-B[1]+L[1])];

  spots:[[.18,.2],[.5,.2],[.82,.2],[.18,.62],[.5,.62],[.82,.62]].map(([u,v])=>P(u,v+.13)).sort((a,b)=>a[1]-b[1]),
  bar:[Math.min(C[0]+30,1370),P(.5,-.2)[1]-10],hit:[P(-.08,-.12),P(1.08,-.12),P(1.08,1.12),P(-.08,1.12)].map(p=>p.join(',')).join(' ')}}
function scaledGeo(base,cx,cy,k){const c=[(base.L[0]+base.T[0]+base.R[0]+base.B[0])/4,(base.L[1]+base.T[1]+base.R[1]+base.B[1])/4];const f=p=>[cx+(p[0]-c[0])*k,cy+(p[1]-c[1])*k];const g=mkGeo(f(base.L),f(base.T),f(base.R),f(base.B));g.k=k;return g}

let forcedHour=null;
const LIGHT=[ // hour, night, warm, windows, stars
 [0,.62,0,1,1],[4.5,.58,0,1,1],[5.5,.4,.25,.9,.6],[6.5,.12,.45,.3,0],[8,0,.15,0,0],[9,0,0,0,0],

function hourNow(){if(forcedHour!=null)return forcedHour;const d=new Date();return d.getHours()+d.getMinutes()/60}
function updateLighting(){const h=hourNow();let a=LIGHT[0],b=LIGHT[1];for(let i=0;i<LIGHT.length-1;i++)if(h>=LIGHT[i][0]&&h<=LIGHT[i+1][0]){a=LIGHT[i];b=LIGHT[i+1];break}
 const k=(h-a[0])/((b[0]-a[0])||1),L=j=>a[j]+(b[j]-a[j])*k;
 $('night').style.opacity=L(1);$('stars').style.opacity=L(4);document.querySelectorAll('.win').forEach(w=>w.style.opacity=L(3));
 const warm=$('warm');warm.style.opacity=L(2);warm.style.background=h<12?'linear-gradient(rgba(255,170,190,.45),rgba(255,214,140,.35))':'linear-gradient(rgba(255,120,60,.45),rgba(255,180,90,.3))';
 const st=$('stars');if(!st.children.length)for(let i=0;i<60;i++){const s=document.createElement('i');s.style.left=Math.random()*1600+'px';s.style.top=Math.random()*280+'px';s.style.animationDelay=Math.random()*1.6+'s';st.appendChild(s)}
 if(typeof Music!=='undefined')Music.duck(L(1)>.4?.55:1)}

function claim(k){$('mQuest').classList.remove('on');const c=elStage($('hCoins')),g=GEO[0];
 if(k==='carrot'){S.quests.carrotDone=true;addCoins(10,c[0],c[1]+70);addXp(20,g.C[0],g.C[1]-60);SND.magic();sayLater([[2,'Морковка — загляденье! Сладкая, хрустящая. Ты прирождённый дачник!']])}
 if(k==='harv'){S.quests.harvDone=true;addCoins(25,c[0],c[1]+70);S.inv.fert+=2;SND.magic();sayLater([[5,'Пять урожаев — вот это хозяйство! Держи пару мешков удобрения от меня.']])}
 if(k==='save'){S.quests.saveDone=true;addXp(20,g.C[0],g.C[1]-60);SND.magic()}
 renderHUD();save()}
function checkQuests(){if(S&&S.done){renderHUD();if(questClaimable())bump('hQuest')}}
$('hQuest').addEventListener('pointerdown',e=>{e.stopPropagation();ac();SND.tap();renderQuests();$('mQuest').classList.add('on')});

/* ---------- modals ---------- */
document.querySelectorAll('[data-close]').forEach(c=>c.addEventListener('click',()=>{c.closest('.modal').classList.remove('on');SND.tap();if(!S.done){camHome(true);setTimeout(updateGuide,50)}}));
function msg(title,text,btns){$('msgTitle').textContent=title;$('msgText').textContent=text;const b=$('msgBtns');b.innerHTML='';btns.forEach(o=>{const d=document.createElement('div');d.className='btn '+(o.cls||'');d.textContent=o.t;d.onclick=()=>{$('mMsg').classList.remove('on');SND.tap();o.f&&o.f()};b.appendChild(d)});$('mMsg').classList.add('on')}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('pointerdown',e=>e.stopPropagation()));

/* ---------- screens ---------- */
function fadeTo(fn){const f=$('fade');f.style.opacity=1;setTimeout(()=>{fn();f.style.opacity=0},500)}
function tryFullscreen(){try{const d=document.documentElement;
 if(!(document.fullscreenElement||document.webkitFullscreenElement)){const r=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):d.webkitRequestFullscreen?d.webkitRequestFullscreen():null;
  if(r&&r.then)r.then(lockLand).catch(()=>{});else lockLand()}else lockLand()}catch(e){}}
function lockLand(){try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}setTimeout(fit,300)}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{tryFullscreen();ac();Music.start()},{capture:true,passive:true}));
document.addEventListener('fullscreenchange',()=>setTimeout(fit,200));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(fit,200));
let lightT=null;
function startGame(state){S=state;tutActive=-1;
 fadeTo(()=>{$('title').style.display='none';$('game').style.display='block';closeTray();guide(null);hint(null);toolHide();
  ['mOrders','mShop','mStore','mQuest','mMsg','mKitchen'].forEach(i=>$(i).classList.remove('on'));
  clearBirds();clearThieves();const away=now()-(S.lastSeen||now());const w0=S.water;tick();const off=S.done?offlinePests(away):null;const stolen=S.done?offlineThieves():0;renderAll();renderScare();renderSecurity();renderKitchenBub(true);startTick();updateLighting();clearInterval(lightT);lightT=setInterval(updateLighting,30000);
  allBeds().forEach((b,i)=>{if(b.busy)toolShow(i,b.busy.type)});
  if(!S.done){
   if(S.tut===0){camTo(BED_C[0],BED_C[1],minS()*1.35);setTimeout(()=>{camHome(true);setTimeout(tutRun,1300)},300)}
   else{camHome();setTimeout(tutRun,600)}}
  else{camHome();setTimeout(()=>{
   const msgs=[];if(off&&off.scared)msgs.push('пугало прогнало ворон: '+off.scared);if(off&&off.ate)msgs.push('вороны клевали урожай');if(off&&off.bugs)msgs.push('на грядках завелись вредители');if(stolen)msgs.push('воришки утащили урожай с '+stolen+' гр.');if(S.kitchen.slots.some(x=>x&&now()>=x.t1))msgs.push('заготовки готовы');if(allBeds().some(isRipe))msgs.push('урожай созрел');if(S.water>w0)msgs.push('бочка набрала воды');if(allBeds().some(needsWater))msgs.push('грядка просит полива');
   toast(greeting()+' '+(msgs.length?'Пока тебя не было: '+msgs.join(', ')+'.':'С возвращением на дачу!'));
   if(level()>S.seenLvl)levelUp();setTimeout(announceNew,1500)},600)}})}
$('hotNew').addEventListener('click',()=>{ac();SND.tap();
 if(loadSave())msgTitle('Новая игра','Начать заново? Весь прогресс будет удалён.',[{t:'Начать заново',cls:'orange',f:()=>{try{localStorage.removeItem(SAVE_KEY);OLD_KEYS.forEach(k=>localStorage.removeItem(k))}catch(e){}startGame(newState())}},{t:'Отмена'}]);
 else startGame(newState())});
$('hotCont').addEventListener('click',()=>{ac();SND.tap();startGame(loadSave()||newState())});
function msgTitle(t,txt,btns){const m=$('mMsg');stage.appendChild(m);m.style.zIndex=95;msg(t,txt,btns||[{t:'Понятно'}])}
$('hMenu').addEventListener('pointerdown',e=>{e.stopPropagation();ac();SND.tap();
 msg('Меню','Прогресс сохраняется сам, а грядки растут, даже когда ты не в игре.',[{t:'Выйти в меню',cls:'orange',f:()=>{save();clearInterval(tickT);fadeTo(()=>{$('game').style.display='none';$('title').style.display='block';hint(null);guide(null);toolHide();$('dlg').classList.remove('on')})}},{t:'Продолжить'}])});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(S){tick();updateLighting()}});
addEventListener('pagehide',()=>save());
setInterval(()=>{if(S&&!document.hidden&&$('game').style.display==='block')S.lastSeen=now()},10000);addEventListener('beforeunload',()=>save());
buildBeds();fit();
window.__dacha={spawnThief,openKitchen,announceNew,spawnBird,infest,birds,get S(){return S},STEPS,fromStage,tick,cam,setHour:h=>{forcedHour=h;updateLighting()},GEO};
})();
</script>
</body>
